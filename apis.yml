name: Molecular Stethoscope
description: Molecular Stethoscope (now operating as Superfluid Dx, Inc.) is a South San
  Francisco clinical-stage diagnostics company developing minimally invasive blood tests
  for neurodegenerative disease. Its cell-free messenger RNA (cf-mRNA) liquid-biopsy platform
  aims to detect Alzheimer's disease at early stages from a routine blood draw, as an
  alternative to spinal taps and brain imaging. Surfaced as a portfolio company of dcvc and
  added to the API Evangelist network. As a clinical diagnostics R&D company it publishes no
  public developer API, documentation, or technical platform; this profile is maintained for
  network completeness rather than API discovery.
